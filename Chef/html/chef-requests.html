<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chef | Restaurant Management System</title>
        <link rel="stylesheet" href="../css/chef.css">
    </head>
    <body id="requests" onload="initializePage()">
        <header>
            <h1>
                <a href="chef-dashboard.html">RESTAURANT MANAGEMENT SYSTEM</a>
            </h1>
            <div class="header-links">
                Chef dashboard 
                <a href="chef-profile.html">Profile</a>
                <a href="../../Admin/html/index.html" onclick="logout()">Logout</a>
            </div>
        </header>
        <div class="layout">
            <nav aria-label="Chef navigation">
                <a href="chef-recipes.html">Recipes</a>
                <a href="chef-tasks.html">Preparation tasks</a>
                <a href="chef-requests.html" class="active" aria-current="page">Stock requests</a>
                <a href="chef-queue.html">Kitchen queue</a>
            </nav>
            <main>
                <h2>Stock requests</h2>
                <div class="toolbar">
                    <input type="search" id="search" aria-label="Search records" placeholder="Search stock requests" oninput="renderTable()">
                    <button type="button" onclick="openForm()">Add request</button>
                </div>
                <p id="notice" class="message" role="status" hidden></p>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Ingredient</th>
                                <th>Quantity</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="records"></tbody>
                    </table>
                </div>
                <section id="detail-panel" class="detail" hidden>
                    <h3>Request details</h3>
                    <div id="details"></div>
                    <button type="button" class="secondary" onclick="closePanels()">Close</button>
                </section>
                <section id="form-panel" class="form-panel" hidden>
                    <h3 id="form-heading">Add request</h3>
                    <form id="record-form" onsubmit="return saveRecord()">
                        <fieldset>
                            <legend>Request information</legend>
                            <label for="item">Ingredient</label>
                            <select id="item" name="item" required>
                                <option value="">Select</option>
                            </select>
                            <label for="quantity">Quantity</label>
                            <input type="number" id="quantity" name="quantity" min="0" step="any" required>
                            <label for="notes">Notes</label>
                            <textarea id="notes" name="notes"></textarea>
                            <label for="date">Date</label>
                            <input type="date" id="date" name="date" required>
                            <label for="status">Status</label>
                            <select id="status" name="status" required>
                                <option value="">Select</option>
                                <option value="Pending">Pending</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </fieldset>
                        <p id="form-error" class="message" role="alert"></p>
                        <div class="form-actions">
                            <button type="submit">Save</button>
                            <button type="button" class="secondary" onclick="closePanels()">Cancel</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
        <script src="../js/chef-data.js"></script>
        <script src="../js/chef.js"></script>
        <script src="../js/chef-profile.js"></script>
    </body>
</html>
