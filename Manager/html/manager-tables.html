<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Manager | Restaurant Management System</title>
        <link rel="stylesheet" href="../css/manager.css">
    </head>
    <body id="tables" onload="initializePage()">
        <header>
            <h1>
                <a href="manager-dashboard.html">RESTAURANT MANAGEMENT SYSTEM</a>
            </h1>
            <div class="header-links">
                Manager dashboard 
                <a href="manager-profile.html">Profile</a>
                <a href="../../Admin/html/index.html" onclick="logout()">Logout</a>
            </div>
        </header>
        <div class="layout">
            <nav aria-label="Manager navigation">
                <a href="manager-tables.html" class="active" aria-current="page">Dining tables</a>
                <a href="manager-inventory.html">Inventory</a>
                <a href="manager-suppliers.html">Suppliers</a>
                <a href="manager-reports.html">Reports</a>
            </nav>
            <main>
                <h2>Dining tables</h2>
                <div class="toolbar">
                    <input type="search" id="search" aria-label="Search records" placeholder="Search dining tables" oninput="renderTable()">
                    <button type="button" onclick="openForm()">Add table</button>
                </div>
                <p id="notice" class="message" role="status" hidden></p>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Table number</th>
                                <th>Seating capacity</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="records"></tbody>
                    </table>
                </div>
                <section id="detail-panel" class="detail" hidden>
                    <h3>Table details</h3>
                    <div id="details"></div>
                    <button type="button" class="secondary" onclick="closePanels()">Close</button>
                </section>
                <section id="form-panel" class="form-panel" hidden>
                    <h3 id="form-heading">Add table</h3>
                    <form id="record-form" onsubmit="return saveRecord()">
                        <fieldset>
                            <legend>Table information</legend>
                            <label for="number">Table number</label>
                            <input type="text" id="number" name="number" required>
                            <label for="capacity">Seating capacity</label>
                            <input type="number" id="capacity" name="capacity" min="1" step="1" required>
                            <label for="location">Location</label>
                            <input type="text" id="location" name="location">
                            <label for="status">Status</label>
                            <select id="status" name="status" required>
                                <option value="">Select</option>
                                <option value="Available">Available</option>
                                <option value="Unavailable">Unavailable</option>
                            </select>
                        </fieldset>
                        <p id="form-error" class="message" role="alert"></p>
                        <div class="form-actions">
                            <button type="submit">Save</button>
                            <button type="button" class="secondary" onclick="closePanels()">Cancel</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
        <script src="../js/manager-data.js"></script>
        <script src="../js/manager.js"></script>
        <script src="../js/manager-profile.js"></script>
    </body>
</html>
