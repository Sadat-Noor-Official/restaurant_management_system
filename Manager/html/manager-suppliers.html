<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Manager | Restaurant Management System</title>
        <link rel="stylesheet" href="../css/manager.css">
    </head>
    <body id="suppliers" onload="initializePage()">
        <header>
            <h1>
                <a href="manager-dashboard.html">RESTAURANT MANAGEMENT SYSTEM</a>
            </h1>
            <div class="header-links">
                Manager dashboard 
                <a href="manager-profile.html">Profile</a>
                <a href="../../Admin/html/index.html" onclick="logout()">Logout</a>
            </div>
        </header>
        <div class="layout">
            <nav aria-label="Manager navigation">
                <a href="manager-tables.html">Dining tables</a>
                <a href="manager-inventory.html">Inventory</a>
                <a href="manager-suppliers.html" class="active" aria-current="page">Suppliers</a>
                <a href="manager-reports.html">Reports</a>
            </nav>
            <main>
                <h2>Suppliers</h2>
                <div class="toolbar">
                    <input type="search" id="search" aria-label="Search records" placeholder="Search suppliers" oninput="renderTable()">
                    <button type="button" onclick="openForm()">Add supplier</button>
                </div>
                <p id="notice" class="message" role="status" hidden></p>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Supplier name</th>
                                <th>Contact person</th>
                                <th>Phone</th>
                                <th>Supplied category</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="records"></tbody>
                    </table>
                </div>
                <section id="detail-panel" class="detail" hidden>
                    <h3>Supplier details</h3>
                    <div id="details"></div>
                    <button type="button" class="secondary" onclick="closePanels()">Close</button>
                </section>
                <section id="form-panel" class="form-panel" hidden>
                    <h3 id="form-heading">Add supplier</h3>
                    <form id="record-form" onsubmit="return saveRecord()">
                        <fieldset>
                            <legend>Supplier information</legend>
                            <label for="name">Supplier name</label>
                            <input type="text" id="name" name="name" required>
                            <label for="contact">Contact person</label>
                            <input type="text" id="contact" name="contact" required>
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone" required>
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                            <label for="category">Supplied category</label>
                            <input type="text" id="category" name="category" required>
                            <label for="address">Address</label>
                            <textarea id="address" name="address"></textarea>
                            <label for="status">Status</label>
                            <select id="status" name="status" required>
                                <option value="">Select</option>
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </fieldset>
                        <p id="form-error" class="message" role="alert"></p>
                        <div class="form-actions">
                            <button type="submit">Save</button>
                            <button type="button" class="secondary" onclick="closePanels()">Cancel</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
        <script src="../js/manager-data.js"></script>
        <script src="../js/manager.js"></script>
        <script src="../js/manager-profile.js"></script>
    </body>
</html>
