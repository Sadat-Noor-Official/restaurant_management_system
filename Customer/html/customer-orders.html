<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Customer | Restaurant Management System</title>
        <link rel="stylesheet" href="../css/customer.css">
    </head>
    <body id="orders" onload="initializePage()">
        <header>
            <h1>
                <a href="customer-dashboard.html">RESTAURANT MANAGEMENT SYSTEM</a>
            </h1>
            <div class="header-links">
                Customer dashboard 
                <a href="customer-profile.html">Profile</a>
                <a href="../../Admin/html/index.html" onclick="logout()">Logout</a>
            </div>
        </header>
        <div class="layout">
            <nav aria-label="Customer navigation">
                <a href="customer-browse.html">Browse menu</a>
                <a href="customer-reservations.html">Reservations</a>
                <a href="customer-orders.html" class="active" aria-current="page">My orders</a>
                <a href="customer-reviews.html">My reviews</a>
            </nav>
            <main>
                <h2>My orders</h2>
                <div class="toolbar">
                    <input type="search" id="search" aria-label="Search records" placeholder="Search my orders" oninput="renderTable()">
                    <button type="button" onclick="openForm()">Add order</button>
                </div>
                <p id="notice" class="message" role="status" hidden></p>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Menu items</th>
                                <th>Date</th>
                                <th>Total (BDT)</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="records"></tbody>
                    </table>
                </div>
                <section id="detail-panel" class="detail" hidden>
                    <h3>Order details</h3>
                    <div id="details"></div>
                    <button type="button" class="secondary" onclick="closePanels()">Close</button>
                </section>
                <section id="form-panel" class="form-panel" hidden>
                    <h3 id="form-heading">Add order</h3>
                    <form id="record-form" onsubmit="return saveRecord()">
                        <fieldset>
                            <legend>Order information</legend>
                            <label>Menu items</label>
                            <div id="items-rows"></div>
                            <button class="secondary" type="button" onclick="addItem()">Add item</button>
                            <p id="item-total"></p>
                            <label for="reservation">Reservation</label>
                            <select id="reservation" name="reservation">
                                <option value="">Select</option>
                            </select>
                            <label for="coupon">Coupon</label>
                            <select id="coupon" name="coupon">
                                <option value="">Select</option>
                            </select>
                            <label for="status">Status</label>
                            <select id="status" name="status" required>
                                <option value="">Select</option>
                                <option value="Pending">Pending</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </fieldset>
                        <p id="form-error" class="message" role="alert"></p>
                        <div class="form-actions">
                            <button type="submit">Save</button>
                            <button type="button" class="secondary" onclick="closePanels()">Cancel</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
        <script src="../js/customer-data.js"></script>
        <script src="../js/customer.js"></script>
        <script src="../js/customer-profile.js"></script>
    </body>
</html>
