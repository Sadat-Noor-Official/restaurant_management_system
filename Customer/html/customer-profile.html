<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Customer | Restaurant Management System</title>
        <link rel="stylesheet" href="../css/customer.css">
    </head>
    <body id="profile" onload="initializePage()">
        <header>
            <h1>
                <a href="customer-dashboard.html">RESTAURANT MANAGEMENT SYSTEM</a>
            </h1>
            <div class="header-links">
                Customer dashboard 
                <a href="customer-profile.html">Profile</a>
                <a href="../../Admin/html/index.html" onclick="logout()">Logout</a>
            </div>
        </header>
        <div class="layout">
            <nav aria-label="Customer navigation">
                <a href="customer-browse.html">Browse menu</a>
                <a href="customer-reservations.html">Reservations</a>
                <a href="customer-orders.html">My orders</a>
                <a href="customer-reviews.html">My reviews</a>
            </nav>
            <main>
                <h2>My profile</h2>
                <img id="profile-photo" class="profile-photo" alt="Profile picture" hidden>
                <form onsubmit="return saveProfile()" id="profile-form">
                    <fieldset>
                        <legend>Account information</legend>
                        <label for="profile-name">Full name</label>
                        <input id="profile-name" type="text" required>
                        <label for="profile-email">Email</label>
                        <input id="profile-email" type="email" required>
                        <label for="profile-phone">Phone</label>
                        <input id="profile-phone" type="tel">
                        <label for="profile-image">Profile picture</label>
                        <input id="profile-image" type="file" accept="image/*" onchange="previewPhoto()">
                    </fieldset>
                    <button type="submit">Save profile</button>
                </form>
                <h3>Change password</h3>
                <form onsubmit="return changePassword()">
                    <label for="old-password">Current password</label>
                    <input type="password" id="old-password" required>
                    <label for="new-password">New password</label>
                    <input type="password" id="new-password" minlength="8" required>
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" minlength="8" required>
                    <button type="submit">Change password</button>
                </form>
                <h3>Account status</h3>
                <button class="secondary" type="button" onclick="deactivateProfile()">Deactivate account</button>
                <p class="message" id="profile-message" role="status"></p>
            </main>
        </div>
        <script src="../js/customer-data.js"></script>
        <script src="../js/customer.js"></script>
        <script src="../js/customer-profile.js"></script>
    </body>
</html>
