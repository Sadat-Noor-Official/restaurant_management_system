<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Customer registration | Restaurant Management System</title>
        <link rel="stylesheet" href="../css/admin.css">
    </head>
    <body id="register" class="auth-page" onload="initializePage()">
        <header>
            <h1>RESTAURANT MANAGEMENT SYSTEM</h1>
        </header>
        <main class="auth-box">
            <h2>Customer registration</h2>
            <form onsubmit="return registerCustomer()">
                <label for="register-name">Full name</label>
                <input id="register-name" type="text" required>
                <label for="register-email">Email</label>
                <input id="register-email" type="email" required>
                <label for="register-phone">Phone</label>
                <input id="register-phone" type="tel" required>
                <label for="register-password">Password</label>
                <input id="register-password" type="password" minlength="8" required>
                <label for="register-confirm">Confirm password</label>
                <input id="register-confirm" type="password" minlength="8" required>
                <button type="submit">Register</button>
                <p>
                    <a href="index.html">Back to login</a>
                </p>
                <p id="auth-message" class="message" role="alert"></p>
            </form>
        </main>
        <script src="../js/admin-data.js"></script>
        <script src="../js/admin.js"></script>
        <script src="../js/admin-profile.js"></script>
        <script src="../js/admin-login.js"></script>
    </body>
</html>
