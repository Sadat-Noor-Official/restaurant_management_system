<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reset password | Restaurant Management System</title>
        <link rel="stylesheet" href="../css/admin.css">
    </head>
    <body id="reset-password" class="auth-page" onload="initializePage()">
        <header>
            <h1>RESTAURANT MANAGEMENT SYSTEM</h1>
        </header>
        <main class="auth-box">
            <h2>Reset password</h2>
            <form onsubmit="return resetPassword()">
                <label for="reset-email">Email</label>
                <input id="reset-email" type="email" required>
                <label for="reset-new-password">New password</label>
                <input id="reset-new-password" type="password" minlength="8" required>
                <label for="reset-confirm">Confirm password</label>
                <input id="reset-confirm" type="password" minlength="8" required>
                <button type="submit">Reset password</button>
                <p>
                    <a href="index.html">Back to login</a>
                </p>
                <p id="auth-message" class="message" role="alert"></p>
            </form>
        </main>
        <script src="../js/admin-data.js"></script>
        <script src="../js/admin.js"></script>
        <script src="../js/admin-profile.js"></script>
        <script src="../js/admin-login.js"></script>
    </body>
</html>
